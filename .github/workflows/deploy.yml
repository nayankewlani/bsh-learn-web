name: Deploy Web App

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production deploy
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            https://bshhealers.com/api/deploy/web \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json")
          echo "Deploy webhook response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Deploy webhook failed with status $STATUS"
            exit 1
          fi
          echo "Deploy triggered successfully — server is building in background"
