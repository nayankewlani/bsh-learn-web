name: Deploy Web App

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger server-side web deploy via webhook
        run: |
          curl -sf -X POST https://bshhealers.com/api/deploy/web \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP %{http_code}"
